<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Survey Form</title>
    <style>
        :root {
            font-family: system-ui;
            color: #363a4f;
        }

        html {
            height: 100vh;
            background: linear-gradient(white, #DBDEFC);
        }
    </style>
</head>

<body>

    <h1 id="title">Sample Survey Form</h1>
    <p id="description">
        This is a description of a survey form.
    </p>

    <form id="survey-form">
        <input id="name" type="text" placeholder="Name" required>
        <label id="label-name" for="name">Name</label><br>
        
        <input id="email" type="text" placeholder="E-mail address" required>
        <label id="label-email" for="email">E-mail</label><br>

        <input id="number" type="number" placeholder="E-mail address" required>
        <label id="label-number" for="number">Number</label><br>

    </form>
</body>

</html>
